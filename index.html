<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b5cf6">
<title>SolTracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --fundo:#f4f5f7;--card:#fff;--texto:#222;--suave:#666;--borda:#d4d4d8;--roxo:#8b5cf6;
  --aviso-fundo:#fff4e6;--aviso-borda:#ffd8a8;--aviso-texto:#7a4100;--sombra:0 1px 3px rgba(0,0,0,.08)
}
@media (prefers-color-scheme:dark){
  :root{
    --fundo:#121214;--card:#1e1e23;--texto:#ececf0;--suave:#a1a1aa;--borda:#3a3a42;
    --aviso-fundo:#33260f;--aviso-borda:#6b4a14;--aviso-texto:#ffd8a8;--sombra:none
  }
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:var(--fundo);color:var(--texto);font-variant-numeric:tabular-nums}

/* Cabeçalho: imagem inteira no computador; no celular, recorte que mantém logo e título legíveis */
.topo{background:var(--roxo)}
.topo img{display:block;width:100%;max-width:1039px;height:auto;margin:0 auto}

main{max-width:1100px;margin:0 auto;padding:16px}

/* Linha de status e botões de período */
.status{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--suave);font-size:13px}
.ponto{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin-right:6px}
.ponto.ok{background:#2f9e44}
.ponto.atrasado{background:#f08c00}
.ponto.erro{background:#e03131}
.periodos{display:flex;gap:6px;margin-left:auto}
.periodos button{min-height:34px;border:1px solid var(--borda);background:var(--card);color:var(--texto);border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer}
.periodos button.ativo{background:var(--roxo);border-color:var(--roxo);color:#fff}
.aviso{background:var(--aviso-fundo);border:1px solid var(--aviso-borda);color:var(--aviso-texto);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:12px}

/* Cartões: 2 por linha no celular, até 4 no computador */
h2{font-size:15px;margin:24px 0 8px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:var(--sombra);border:1px solid transparent}
.rot{font-size:12px;color:var(--suave)}
.val{font-size:26px;font-weight:600;margin-top:4px;white-space:nowrap}
.un{font-size:14px;color:var(--suave);font-weight:400}

/* Gráficos: um embaixo do outro; lado a lado em telas largas */
.graficos{display:grid;grid-template-columns:1fr;gap:0 16px}
.graf{position:relative;background:var(--card);border-radius:10px;padding:12px;height:280px;box-shadow:var(--sombra)}
footer{color:var(--suave);font-size:12px;text-align:center;padding:24px 16px}
footer a{color:var(--roxo)}

@media (min-width:900px){
  .grade{grid-template-columns:repeat(4,1fr)}
  .graficos{grid-template-columns:1fr 1fr}
  .graf{height:300px}
}
@media (prefers-color-scheme:dark){
  .card,.graf{border-color:var(--borda)}
}
@media (max-width:600px){
  .topo img{height:110px;object-fit:cover;object-position:left center}
  main{padding:12px}
  .status{flex-direction:column;align-items:stretch}
  .periodos{margin-left:0}
  .periodos button{flex:1;min-height:40px;font-size:14px}
  .grade{gap:10px}
  .card{padding:10px 12px}
  .val{font-size:22px}
  .graf{height:230px;padding:8px}
}
</style>
</head>
<body>
<header class="topo">
  <img src="img/banner.png" alt="SolTracker - Engineering Lab Una - CDU 2026.2">
</header>

<main>
<div class="status">
  <span><span class="ponto" id="ponto"></span><span id="estado">Carregando…</span></span>
  <span class="periodos" id="periodos"></span>
</div>
<div class="aviso" id="aviso" hidden></div>

<h2>Placas</h2>
<div class="grade">
  <div class="card"><div class="rot">Placa 1 (tracker)</div><div class="val"><span id="v1">--</span> <span class="un">V</span></div><div class="rot"><span id="p1">--</span> W</div></div>
  <div class="card"><div class="rot">Placa 2 (fixa)</div><div class="val"><span id="v2">--</span> <span class="un">V</span></div><div class="rot"><span id="p2">--</span> W</div></div>
  <div class="card"><div class="rot">Ganho do tracker</div><div class="val"><span id="ganho">--</span> <span class="un">%</span></div></div>
  <div class="card"><div class="rot">Inclinação da placa 1</div><div class="val"><span id="inc">--</span> <span class="un">°</span></div></div>
</div>

<h2>Irradiância</h2>
<div class="grade">
  <div class="card"><div class="rot">Solar (LDR)</div><div class="val"><span id="irr">--</span> <span class="un">W/m²</span></div></div>
  <div class="card"><div class="rot">UV eritêmica (GUVA)</div><div class="val"><span id="irrUV">--</span> <span class="un">W/m²</span></div><div class="rot">Índice UV: <span id="uvi">--</span></div></div>
</div>

<div class="graficos">
  <section>
    <h2>Potência das placas (W)</h2>
    <div class="graf"><canvas id="gPot"></canvas></div>
  </section>
  <section>
    <h2>Irradiância (W/m²)</h2>
    <div class="graf"><canvas id="gIrr"></canvas></div>
  </section>
</div>

<footer>Dados: <span id="fonte">--</span></footer>
</main>

<script>
const cfg = window.SOLTRACKER || {};
const DEMO = !cfg.canalId;

// Campos do canal no ThingSpeak (iguais aos enviados pelo ESP32)
const CAMPOS = { v1: 'field1', v2: 'field2', inc: 'field3', p1: 'field4', p2: 'field5', irr: 'field6', irrUV: 'field7', uvi: 'field8' };

// [rótulo, minutos de histórico, média em minutos (0 = sem média)]
const PERIODOS = [['1 h', 60, 0], ['6 h', 360, 0], ['24 h', 1440, 10], ['7 dias', 10080, 60]];
let periodo = PERIODOS[2];
let gPot = null, gIrr = null;

function $(id) { return document.getElementById(id); }
function num(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : null; }
function fmt(v, casas) { return v === null ? '--' : v.toFixed(casas); }

// Último valor preenchido de um campo (os mais recentes podem vir vazios)
function ultimo(feeds, campo) {
  for (let i = feeds.length - 1; i >= 0; i--) {
    const n = num(feeds[i][campo]);
    if (n !== null) return n;
  }
  return null;
}

function rotuloHora(data) {
  const op = periodo[1] > 1440
    ? { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }
    : { hour: '2-digit', minute: '2-digit' };
  return data.toLocaleString('pt-BR', op);
}

// ---------- Dados ----------
async function lerThingSpeak(params) {
  const url = new URL('https://api.thingspeak.com/channels/' + encodeURIComponent(cfg.canalId) + '/feeds.json');
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  if (cfg.chaveLeitura) url.searchParams.set('api_key', cfg.chaveLeitura);

  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('o ThingSpeak respondeu com erro ' + r.status);
  const j = await r.json();
  if (!j || !Array.isArray(j.feeds)) throw new Error('canal não encontrado ou privado (confira canalId e chaveLeitura)');
  return j.feeds;
}

// Dados inventados para ver o layout antes de configurar o canal
function dadosDemo(minutos, passoMin) {
  const feeds = [];
  const agora = Date.now();
  const passo = Math.max(passoMin, minutos / 300) * 60000;
  for (let t = agora - minutos * 60000; t <= agora; t += passo) {
    const d = new Date(t);
    const h = d.getHours() + d.getMinutes() / 60;
    const sol = Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
    const ruido = 0.95 + 0.1 * Math.random();
    const irr = 950 * sol * ruido;
    const v1 = sol > 0 ? 4.2 + 1.0 * Math.sqrt(sol) : 0;
    const v2 = sol > 0 ? 3.9 + 1.0 * sol : 0;
    const uvi = 11 * sol * sol * ruido;
    feeds.push({
      created_at: d.toISOString(),
      field1: v1.toFixed(2), field2: v2.toFixed(2),
      field3: (sol > 0 ? Math.round(60 - 50 * Math.cos((h - 6) / 12 * Math.PI)) : 45).toString(),
      field4: (v1 * v1 / 27).toFixed(3), field5: (v2 * v2 / 27).toFixed(3),
      field6: irr.toFixed(1), field7: (uvi * 0.025).toFixed(4), field8: uvi.toFixed(2)
    });
  }
  return feeds;
}

async function buscar() {
  const [, minutos, media] = periodo;
  if (DEMO) {
    const historico = dadosDemo(minutos, media || 1);
    return { historico, recentes: historico.slice(-10) };
  }
  const params = { minutes: minutos };
  if (media) params.average = media;
  const [historico, recentes] = await Promise.all([lerThingSpeak(params), lerThingSpeak({ results: 10 })]);
  return { historico, recentes };
}

// ---------- Tela ----------
function mostrarCartoes(recentes) {
  const v = {};
  for (const [nome, campo] of Object.entries(CAMPOS)) v[nome] = ultimo(recentes, campo);

  $('v1').textContent = fmt(v.v1, 2);  $('p1').textContent = fmt(v.p1, 3);
  $('v2').textContent = fmt(v.v2, 2);  $('p2').textContent = fmt(v.p2, 3);
  $('ganho').textContent = v.p1 !== null && v.p2 !== null && v.p2 > 0.01 ? ((v.p1 - v.p2) / v.p2 * 100).toFixed(1) : '--';
  $('inc').textContent = fmt(v.inc, 0);
  $('irr').textContent = fmt(v.irr, 0);
  $('irrUV').textContent = fmt(v.irrUV, 3);
  $('uvi').textContent = fmt(v.uvi, 1);
}

function mostrarEstado(recentes) {
  const ponto = $('ponto');
  if (!recentes.length) {
    ponto.className = 'ponto atrasado';
    $('estado').textContent = 'O canal ainda não recebeu dados';
    return;
  }
  const ultimaData = new Date(recentes[recentes.length - 1].created_at);
  const minutos = Math.round((Date.now() - ultimaData) / 60000);
  ponto.className = 'ponto ' + (minutos <= 2 ? 'ok' : 'atrasado');
  const hoje = ultimaData.toDateString() === new Date().toDateString();
  const quando = hoje ? ultimaData.toLocaleTimeString('pt-BR') : ultimaData.toLocaleString('pt-BR');
  $('estado').textContent = 'Última leitura: ' + quando +
    (minutos <= 2 ? ' (ao vivo)' : ' (há ' + minutos + ' min, o tracker pode estar desligado)');
}

const telaPequena = () => window.matchMedia('(max-width: 600px)').matches;

function criarGrafico(id, series, doisEixos) {
  // Cores do texto e das grades seguem o tema claro/escuro da página
  const estilo = getComputedStyle(document.documentElement);
  Chart.defaults.color = estilo.getPropertyValue('--suave').trim();
  Chart.defaults.borderColor = estilo.getPropertyValue('--borda').trim();

  return new Chart($(id), {
    type: 'line',
    data: { labels: [], datasets: series.map(s => ({ label: s[0], borderColor: s[1], backgroundColor: s[1], yAxisID: s[2], data: [], pointRadius: 0, borderWidth: 2, tension: 0.3, spanGaps: true })) },
    options: {
      animation: false, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { boxWidth: 12, boxHeight: 12, font: { size: telaPequena() ? 11 : 12 } } } },
      scales: {
        x: { ticks: { maxTicksLimit: telaPequena() ? 4 : 8, maxRotation: 0, font: { size: 11 } } },
        y: { position: 'left', beginAtZero: true, ticks: { font: { size: 11 } } },
        y1: { display: doisEixos, position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, ticks: { font: { size: 11 } } }
      }
    }
  });
}

function mostrarGraficos(historico) {
  if (!window.Chart) return;
  if (!gPot) {
    gPot = criarGrafico('gPot', [['Placa 1 (tracker)', '#e8590c', 'y'], ['Placa 2 (fixa)', '#1c7ed6', 'y']], false);
    gIrr = criarGrafico('gIrr', [['Solar (LDR)', '#f59f00', 'y'], ['UV eritêmica (eixo direito)', '#7048e8', 'y1']], true);
  }
  const rotulos = historico.map(f => rotuloHora(new Date(f.created_at)));
  const serie = campo => historico.map(f => num(f[campo]));

  gPot.data.labels = rotulos;
  gPot.data.datasets[0].data = serie(CAMPOS.p1);
  gPot.data.datasets[1].data = serie(CAMPOS.p2);
  gPot.update();

  gIrr.data.labels = rotulos;
  gIrr.data.datasets[0].data = serie(CAMPOS.irr);
  gIrr.data.datasets[1].data = serie(CAMPOS.irrUV);
  gIrr.update();
}

async function atualizar() {
  try {
    const { historico, recentes } = await buscar();
    mostrarCartoes(recentes);
    mostrarEstado(recentes);
    mostrarGraficos(historico);
  } catch (e) {
    $('ponto').className = 'ponto erro';
    $('estado').textContent = 'Não foi possível ler os dados: ' + e.message;
  }
}

function montarPeriodos() {
  for (const p of PERIODOS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.className = p === periodo ? 'ativo' : '';
    b.onclick = () => {
      periodo = p;
      document.querySelectorAll('#periodos button').forEach(x => x.className = x === b ? 'ativo' : '');
      atualizar();
    };
    $('periodos').appendChild(b);
  }
}

if (DEMO) {
  const aviso = $('aviso');
  aviso.hidden = false;
  aviso.textContent = 'Modo demonstração: os valores são simulados. Preencha o canalId em config.js para mostrar os dados reais do ThingSpeak.';
  $('fonte').textContent = 'simulados (modo demonstração)';
} else {
  $('fonte').innerHTML = '<a href="https://thingspeak.mathworks.com/channels/' + encodeURIComponent(cfg.canalId) + '" target="_blank" rel="noopener">canal ' + cfg.canalId + ' no ThingSpeak</a>';
}

montarPeriodos();
atualizar();
setInterval(atualizar, (cfg.atualizarSegundos || 30) * 1000);
</script>
</body>
</html>
